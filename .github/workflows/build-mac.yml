name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVER: 'false'
          ELECTRON_BUILDER_CACHE: /tmp/electron-builder-cache
      - uses: actions/upload-artifact@v4
        with:
          name: 1+1schedule-mac
          path: |
            dist-exe/*.dmg
            dist-exe/mac/*.app/**/*

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: 1+1schedule-win
          path: dist-exe/win-unpacked/**/*
